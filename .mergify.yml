pull_request_rules:
  - name: required-team-merge-probe
    conditions:
      - label = vm4-required-team-go
    actions:
      merge:
        method: squash
  - name: VM4 copy safe-template second-order runtime
    conditions:
      - number = 80
    actions:
      copy:
        branches:
          - vm4-copy-template-dest-20260917
        title: "COPY PREVIEW {{ title }}"
        body: |
          COPY_BODY_BEGIN
          {{ body }}
          COPY_BODY_END
